<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple de tableau 2D avec javascript</title>
</head>
<body>
    <h1>Exemple de tableau 2D(Matrice) avec javascript</h1>
    <!--zone d'affichage -->
    <pre id="output"></pre>
    <!--integration de javascript-->
    <script>
        //function pour aficher le texte
        function afficher(text){
            const pre =document.getElementById('output');
            pre.textContent+=text+'\n';
        
        }
        // declaration d'un tableau 2D (matrice)
        let matrice=[
            [1,2],// ligne 1
            [3,4],// ligne 2
            [5,6],// ligne 3
            [7,8]  // ligne 4
        ];
        //affichage de la matrice
        afficher
        for(let i=0;i<matrice.length;i++){
            afficher(matrice[i].join(', '));
        }
        // acces a un element de la matrice
        afficher("\n element matrice[0][1]: " + matrice[0][1]);
        //acces a la ligne 8
        afficher("\n element martrice[3][1]: " + matrice[3][1]);

        // modification d'un element de la matrice
        matrice[1][0]=10;
        afficher("\n matrice apres modification: ");
        for(let i=0;i<matrice.length;i++){
            afficher("ligne :"+i+" : "+matrice[i].join(', '));
        }



    </script>
    
</body>
</html>
