<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple de tableau avec boucle while</title>
</head>
<body>
    <script>
        // declaration d'un tableau
        let fruits=['Pomme','Banane','Orange','Fraise'];
        console.log("Affichage du tableau avec boucle while:");
        //initilisation de la variable de controle i à 0
        let i=0;
        while(i<fruits.length){
            console.log(fruits[i]);
            i++;
        }   

    </script>
    
</body>
</html>
